<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Welcome! </title>
    </head>
    <body>
        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/"
            }
        }
        </script>
        Hello user
        <a href="{{ url_for('profile') }}">Profile</a>
        <a href="{{ url_for('index') }}">Settings</a>
        {% if is_admin %}
        <a href="{{ url_for('admin') }}">Admin page</a>
        {% endif %}
        <form id="mainForm", action="{{ url_for('start') }}" method="post" novalidate>
            {{ form.hidden_tag() }}
            {{ form.start() }}
        </form>
        <p id="responseText">Press the button!</p>
        <span id="tableSpan">{% include "table.html" %}</span>
        <div style="display:flex; flex-direction: column; width: 300px; height: 500px;">
            <div id="threejs_container" style="flex-grow: 1;"></div>
            <p><input type="text" id="speechReplacement" placeholder="type here if speech problem"></p>
            <button id="agent_button">Press and hold to speak</button>
            <p id="status"></p>
        </div>
        <script>
            const mainForm = document.getElementById('mainForm');
            const responseText = document.getElementById('responseText')
            mainForm.addEventListener('submit', async (event) => {
                event.preventDefault()
                const formData = new FormData(mainForm)
                try{
                    const response = await fetch('/start', {method:'POST', body:formData});
                    if (response.ok) {
                        const result = await response.json();
                        responseText.textContent = 'Button pressed with no refresh!'
                        console.log('success:', result);
                    } else {
                        const error = await response.json();
                        console.error('response error:', error);
                    }
                } catch (error) {
                    console.error('fetch error:', error);
                }
            });

            function prev_page() {
                fetch("{{ url_for("paginated_prev") }}")
                    .then(response => response.text())
                    .then(html => {
                        document.getElementById("tableSpan").innerHTML = html;
                    });
            }
            function next_page() {
                fetch("{{ url_for("paginated_next") }}")
                    .then(response => response.text())
                    .then(html => {
                        document.getElementById("tableSpan").innerHTML = html;
                    });
            }
        </script>
<script type="module" src="{{ url_for('static', filename='threejs_container.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='agent_button.js' )}}"></script>
    </body>
</html>
