{% extends "base.html" %}

{% block content %}

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/"
        }
    }
</script>

<script type="module" src="{{ url_for('static', filename='threejs_container.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='agent_button.js') }}"></script>

<style>
    .dashboard-wrapper {
        display: flex;
        flex-direction: row;
        gap: 20px;
        padding: 20px;
        height: calc(100vh - 60px);
        box-sizing: border-box;
        background-color: var(--bg-light);

        width: 100%;
        max-width: 100%;
    }

    .dashboard-col {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        padding: 20px;
        overflow: hidden;
    }


    .col-table {
        flex: 4;
        min-width: 350px;
    }

    .col-agent {
        flex: 3.5;
        min-width: 300px;
    }

    .col-chat {
        flex: 2.5;
        min-width: 250px;
    }

    h3 {
        margin: 0 0 15px 0;
        font-size: 1.1rem;
        color: var(--primary-color, #2c3e50);
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
        text-align: center;
    }

    .table-container {
        flex: 1;
        overflow-y: auto;
    }

    .pagination-controls {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
    }

    .pagination-btn {
        background: #f9f9f9;
        border: 1px solid #ddd;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
    }

    .pagination-btn:hover {
        border-color: var(--accent-color);
        color: var(--accent-color);
    }


    .agent-layout {
        display: flex;
        flex-direction: column;
        height: 100%;
        gap: 15px;
    }

    .viewport-box {
        flex: 1;
        background-color: #f0f2f5;
        border-radius: 8px;
        border: 1px solid #ddd;
        position: relative;
        overflow: hidden;
        min-height: 200px;
    }

    #threejs_container {
        width: 100%;
        height: 100%;
        display: block;
    }

    .controls-box {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    #agent_button {
        width: 100%;
        padding: 12px;
        background-color: var(--primary-color, #2c3e50);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    #agent_button:hover {
        background-color: #34495e;
        transform: translateY(-1px);
    }

    #agent_button:disabled {
        background-color: #95a5a6;
        cursor: not-allowed;
        transform: none;
    }

    .toggle-label {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 0.9rem;
        color: #555;
        cursor: pointer;
    }


    .chat-layout {
        display: flex;
        flex-direction: column;
        height: 100%;
        gap: 15px;
    }

    .chat-block {
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .chat-label {
        font-size: 0.75rem;
        font-weight: bold;
        color: #95a5a6;
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    textarea {
        width: 100%;
        height: 100%;
        padding: 12px;
        border: 1px solid #eee;
        background-color: #fafafa;
        border-radius: 6px;
        resize: none;
        font-size: 0.95rem;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    textarea:focus {
        outline: none;
        border-color: var(--accent-color);
        background-color: white;
    }

    .hints-section {
        border-top: 1px solid #eee;
        padding-top: 10px;
        font-size: 0.85rem;
    }

    .hints-section summary {
        color: #888;
        cursor: pointer;
        text-align: center;
    }
</style>

<div class="dashboard-wrapper">

    <div class="dashboard-col col-table">
        <h3>📂 Data Overview</h3>

        <div id="tableSpan">
            {% include "table.html" %}
        </div>
    </div>

    <div class="dashboard-col col-agent">
        <h3>🤖 AI Agent</h3>

        <div class="agent-layout">
            <div class="viewport-box">
                <div id="threejs_container"></div>
            </div>

            <div class="controls-box">
                <button id="agent_button">Click before speaking</button>
                <label class="toggle-label">
                    <input type="checkbox" onclick="handleCheckbox(this)">
                    <span>Use Text Input</span>
                </label>
            </div>
        </div>
    </div>

    <div class="dashboard-col col-chat">
        <h3>💬 Communication</h3>

        <div class="chat-layout">
            <div class="chat-block">
                <span class="chat-label">User Input</span>
                <textarea id="user_input" readonly placeholder="Listening..."></textarea>
            </div>

            <div class="chat-block">
                <span class="chat-label">Agent Output</span>
                <textarea id="status" readonly placeholder="Agent response..."></textarea>
            </div>

            <div class="hints-section">
                <details>
                    <summary>Show Available Commands</summary>
                    <div id="hintsDiv" style="margin-top: 10px; color: #555;">
                        {% include "list.html" %}
                    </div>
                </details>
            </div>
        </div>
    </div>

</div>

<script>
    function prev_page() {
        fetch("{{ url_for('paginated_prev') }}")
            .then(response => response.text())
            .then(html => {
                document.getElementById("tableSpan").innerHTML = html;
            });
    }

    function next_page() {
        fetch("{{ url_for('paginated_next') }}")
            .then(response => response.text())
            .then(html => {
                document.getElementById("tableSpan").innerHTML = html;
            });
    }

    function handleCheckbox(checkbox) {
        const userInput = document.getElementById("user_input");
        const agentBtn = document.getElementById("agent_button");

        userInput.readOnly = !checkbox.checked;
        agentBtn.disabled = checkbox.checked;

        if (checkbox.checked) {
            userInput.placeholder = "Type your command here...";
            userInput.focus();
            agentBtn.innerText = "Voice Mode Disabled";
            agentBtn.style.opacity = "0.6";
        } else {
            userInput.placeholder = "Listening...";
            agentBtn.innerText = "Click before speaking";
            agentBtn.style.opacity = "1";
        }
    }
</script>

{% endblock %}
