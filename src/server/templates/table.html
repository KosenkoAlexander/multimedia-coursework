{% if paginated %}

<div class="pagination-controls">
    <button class="pagination-btn" {% if paginated.prev_page_num() is not none %} onclick="prev_page()" {% else %}
        disabled {% endif %}>← Prev</button>
    <button class="pagination-btn" {% if paginated.next_page_num() is not none %} onclick="next_page()" {% else %}
        disabled {% endif %}>Next →</button>
</div>

<div class="table-container">
    <!-- <span > -->
    <div style="margin-bottom: 10px; color: #7f8c8d; font-size: 0.9rem; font-weight: 600;">
        Page {{ paginated.page+1 }} / {{ paginated.pages }}
    </div>

    <table style="width: 100%; border-collapse: collapse; font-size: 0.95rem;">
        <thead>
            <tr style="background-color: #f8f9fa; border-bottom: 2px solid #dfe6e9;">
                {% for h in paginated.header %}
                <th style="padding: 12px; text-align: left; color: #2c3e50; font-weight: 700;">
                    {{ h }}
                </th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in paginated.get_current_items() %}
            <tr style="border-bottom: 1px solid #eee; transition: background 0.2s;">
                {% for cell in row %}
                <td style="padding: 10px; color: #555;">{{ cell }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <!-- </span> -->
</div>

<style>
    tbody tr:hover {
        background-color: #f1f2f6;
    }

    .fav-btn.active {
        background-color: gold;
    }
</style>

<script>
    function chFav(btn, bookId) {
        fetch(`/toggle_favorite/${bookId}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                // "X-CSRFToken": "x"
            },
            body: JSON.stringify({ from_table: true })
        })
            .then(response => response.json())
            .then(data => {
                if (data.is_favorite || !data.is_favorite) {
                    // TODO render buttons with actual fav status?
                    btn.classList.toggle("active");
                }
            })
            .catch(err => console.error(err));
    }
</script>

{% endif %}
